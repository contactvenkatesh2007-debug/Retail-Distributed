name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retail_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, pdo_mysql, redis, gd
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: retail_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run Tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: retail_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get EC2 Instance IP
        id: ec2-ip
        run: |
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids i-0ed07d391b8a885e9 \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $INSTANCE_IP"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ steps.ec2-ip.outputs.ip }} >> ~/.ssh/known_hosts

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ steps.ec2-ip.outputs.ip }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ steps.ec2-ip.outputs.ip }} << 'EOF'
            set -e
            cd /var/www/retail || exit 1
            
            echo "📦 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            
            echo "📦 Installing dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "🗄️ Running migrations..."
            php artisan migrate --force
            
            echo "🧹 Clearing caches..."
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            
            echo "⚡ Optimizing..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🔄 Restarting services..."
            sudo systemctl restart php8.2-fpm || true
            sudo systemctl restart nginx || true
            sudo supervisorctl restart all || true
            
            echo "✅ Deployment complete!"
          EOF

      - name: Verify Deployment
        run: |
          sleep 5
          curl -f http://${{ steps.ec2-ip.outputs.ip }}/api/v1/health || exit 1
          echo "✅ Health check passed!"
